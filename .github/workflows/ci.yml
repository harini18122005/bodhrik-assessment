name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Python 3.12 environment with pip caching for speed
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Step 3: Upgrade pip and install all project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Ruff to perform static code analysis/linting
      - name: Run Ruff Linter
        run: ruff check app tests worker.py

      # Step 5: Run unit tests using pytest
      - name: Run Pytest Tests
        run: pytest
